# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.v3.yml — Ychain / chain-api v3 development environment
#
# Architecture:
#   2 × Bitcoin Core (regtest, peered)    — btc-node-1, btc-node-2 (BOTH EQUAL)
#   2 × TRON FullNode (private net)       — tron-node-1 (SR witness), tron-node-2 (observer)
#   1 × PostgreSQL                        — shared DB for all engine instances
#   2 × chain-api engine (active-active)  — engine-1, engine-2 (SKIP LOCKED)
#   2 × btc-indexer                       — one per BTC node, write to chain_events
#   2 × tron-indexer                      — one per TRON node, write to chain_events
#   1 × nginx                             — load balancer (engine-1 + engine-2 upstream)
#   1 × test-ui proxy                     — optional, for manual testing
#
# KEY v3 PRINCIPLE — Bitcoin Core nodes are STATELESS:
#   Engine has no FWallet, no importaddress, no listunspent.
#   ALL operations (PSBT build, broadcast, fee est, tx lookup) work on ANY node.
#   Nodes differ only by: priority (routing preference) and role (full/broadcast_only).
#   "primary"/"standby" labels do NOT apply — every full node is equivalent.
#
#   btc-node-1 vs btc-node-2 in regtest DEV only:
#     btc-node-1 is the "miner" (genesis blocks, test confirmations)
#     btc-node-2 syncs from btc-node-1 via P2P (-addnode)
#     This is a dev convenience, NOT an architecture concept.
#     In production: both nodes are peers of the Bitcoin mainnet/testnet network.
#
# Active-active engines:
#   Both engines run with WORKERS_ENABLED=true.
#   PostgreSQL SKIP LOCKED prevents duplicate processing of chain_events,
#   webhook deliveries, and other queued work.
#   CLUSTER_ENABLED=true — ClusterHeartbeatWorker tracks leader in engine_instances.
#
# Usage:
#   docker compose -f docker-compose.v3.yml up -d
#   docker compose -f docker-compose.v3.yml logs -f
#   docker compose -f docker-compose.v3.yml down -v   # wipe all volumes
# ─────────────────────────────────────────────────────────────────────────────

x-tron-node-common: &tron-node-common
  image: tronprotocol/java-tron:GreatVoyage-v4.7.7
  platform: linux/amd64   # java-tron is amd64-only; Docker Desktop emulates via Rosetta on Apple Silicon
  mem_limit: 2g
  mem_reservation: 512m
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8090/wallet/getnowblock >/dev/null || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 40
    start_period: 30s

x-btc-node-common: &btc-node-common
  image: lncm/bitcoind:v25.0
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - bitcoin-cli
      - -regtest
      - -rpcuser=bitcoin
      - -rpcpassword=bitcoin
      - getblockchaininfo
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 15s

x-engine-common: &engine-common
  build:
    context: ../engine
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &engine-env-common
    DB_TYPE: postgres
    DATABASE_URL: postgres://chainapi:chainapi_dev@postgres:5432/chainapi
    BITCOIN_RPC_URL: http://btc-node-1:18443
    BITCOIN_RPC_USER: bitcoin
    BITCOIN_RPC_PASSWORD: bitcoin
    BITCOIN_NETWORK: regtest
    BITCOIN_CORE_PROVISIONING_ENABLED: "false"
    CLUSTER_ENABLED: "true"
    WORKERS_ENABLED: "true"
    DEPOSIT_MONITOR_INTERVAL_MS: "30000"
    BTC_DEFAULT_CONFIRMATIONS: "5"
    BTC_FINALITY_CONFIRMATIONS: "8"
    LOG_LEVEL: info
    # Chain node RPC passwords — referenced by chain_nodes table via env:VAR_NAME
    BTC_NODE_1_RPC_PASSWORD: bitcoin
    BTC_NODE_2_RPC_PASSWORD: bitcoin
    # v3: disable legacy FWallet deposit monitor — deposits handled by btc-indexer → chain_events
    LEGACY_DEPOSIT_MONITOR_ENABLED: "false"
    # TRON private network (tron-node-1 is the SR witness / primary HTTP endpoint)
    TRON_NODE_URL: http://tron-node-1:8090
    TRON_SOLIDITY_NODE_URL: http://tron-node-1:8091
    TRON_NETWORK: private
    TRON_DEFAULT_CONFIRMATIONS: "1"
    TRON_FINALITY_CONFIRMATIONS: "20"
    # Set by start.sh after deploy-trc20.js runs; empty until then
    TRON_USDT_CONTRACT_ADDRESS: ${TRON_USDT_CONTRACT_ADDRESS:-}
  depends_on:
    postgres:
      condition: service_healthy
    btc-node-1:
      condition: service_healthy

x-indexer-common: &indexer-common
  build:
    context: ../packages/btc-indexer
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &indexer-env-common
    INDEXER_CHAIN_ID: bitcoin
    INDEXER_BTC_NODE_USER: bitcoin
    INDEXER_BTC_NODE_PASSWORD: bitcoin
    INDEXER_BTC_NETWORK: regtest
    INDEXER_POLL_INTERVAL_MS: "5000"
    INDEXER_LOG_LEVEL: info
    DATABASE_URL: postgres://chainapi:chainapi_dev@postgres:5432/chainapi
    INDEXER_FINALITY_CONFIRMATIONS: 10

x-tron-indexer-common: &tron-indexer-common
  build:
    context: ../packages/tron-indexer
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &tron-indexer-env-common
    INDEXER_CHAIN_ID: tron
    INDEXER_POLL_INTERVAL_MS: "3000"
    INDEXER_LOG_LEVEL: info
    DATABASE_URL: postgres://chainapi:chainapi_dev@postgres:5432/chainapi
    INDEXER_FINALITY_CONFIRMATIONS: "20"
    # Set by start.sh after deploy-trc20.js; empty until first reset/start
    INDEXER_WATCHED_CONTRACTS: ${TRON_USDT_CONTRACT_ADDRESS:-}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chainapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chainapi
      POSTGRES_USER: chainapi
      POSTGRES_PASSWORD: chainapi_dev
    ports:
      - "5433:5432"     # 5433 on host → avoids conflict with local Homebrew PostgreSQL on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainapi -d chainapi"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ── Bitcoin Core — Node 1 ─────────────────────────────────────────────────
  # Dev role: "miner" — mines genesis blocks and test confirmations via start.sh.
  # Architecture role: EQUIVALENT to node-2. Engine uses both interchangeably.
  # Indexer btc-indexer-1 watches this node.
  btc-node-1:
    <<: *btc-node-common
    container_name: chainapi-btc-node-1
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=bitcoin
      - -rpcpassword=bitcoin
      - -fallbackfee=0.0001
      - -txindex=1
      - -server=1
      - -rest=1
      - -addnode=btc-node-2:18444    # P2P peer — both nodes see the same blocks
    ports:
      - "18443:18443"   # RPC port (accessible from host)
      - "18444:18444"   # P2P regtest
    volumes:
      - btc_node_1:/data/.bitcoin

  # ── Bitcoin Core — Node 2 ─────────────────────────────────────────────────
  # Dev role: syncs blockchain from btc-node-1 via P2P.
  # Architecture role: EQUIVALENT to node-1. Engine uses both interchangeably.
  # Indexer btc-indexer-2 watches this node (dedup via ON CONFLICT DO NOTHING).
  # Provides indexer redundancy: if btc-indexer-1 dies, deposits still detected.
  btc-node-2:
    <<: *btc-node-common
    container_name: chainapi-btc-node-2
    command:
      - -regtest=1
      - -printtoconsole
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=bitcoin
      - -rpcpassword=bitcoin
      - -fallbackfee=0.0001
      - -txindex=1
      - -server=1
      - -rest=1
      - -addnode=btc-node-1:18444    # P2P peer — syncs same blockchain
    ports:
      - "18453:18443"   # RPC port (separate host port to avoid conflict)
      - "18454:18444"   # P2P regtest
    volumes:
      - btc_node_2:/data/.bitcoin
    depends_on:
      btc-node-1:
        condition: service_healthy

  # ── TRON FullNode — Node 1 (SR witness / block producer) ──────────────────
  # Dev role: produces blocks every 3s on the private TRON network.
  # Architecture role: primary HTTP endpoint for engine and tron-indexer-1.
  # localwitness key is the TRON genesis account — kept in config-node1.conf.
  tron-node-1:
    <<: *tron-node-common
    container_name: chainapi-tron-node-1
    command: ["--witness", "-c", "/etc/tron/config.conf"]
    ports:
      - "8090:8090"     # HTTP FullNode API
      - "8091:8091"     # HTTP SolidityNode API
      - "18888:18888"   # P2P
    volumes:
      - tron_node_1:/data/tron
      - ./tron/config-node1.conf:/etc/tron/config.conf:ro

  # ── TRON FullNode — Node 2 (observer / sync-only) ──────────────────────────
  # Dev role: syncs from tron-node-1 via P2P. No block production.
  # Architecture role: indexer redundancy — tron-indexer-2 watches this node.
  tron-node-2:
    <<: *tron-node-common
    container_name: chainapi-tron-node-2
    command: ["-c", "/etc/tron/config.conf"]
    volumes:
      - tron_node_2:/data/tron
      - ./tron/config-node2.conf:/etc/tron/config.conf:ro
    depends_on:
      tron-node-1:
        condition: service_healthy

  # ── Engine — Instance 1 (cluster leader candidate) ─────────────────────────
  engine-1:
    <<: *engine-common
    container_name: chainapi-engine-1
    environment:
      <<: *engine-env-common
      PORT: "3000"
      ENGINE_URL: http://engine-1:3000
      CLUSTER_PEER_URLS: http://engine-2:3000
      # API_KEY and ADMIN_KEY injected from host .env (see start.sh --v3)
      API_KEY: ${API_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CUSTOMER_SESSION_SECRET: ${CUSTOMER_SESSION_SECRET:-change-me-in-production-min-32-chars!!}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ── Engine — Instance 2 (active-active standby) ────────────────────────────
  engine-2:
    <<: *engine-common
    container_name: chainapi-engine-2
    environment:
      <<: *engine-env-common
      PORT: "3000"
      ENGINE_URL: http://engine-2:3001
      CLUSTER_PEER_URLS: http://engine-1:3000
      API_KEY: ${API_KEY:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CUSTOMER_SESSION_SECRET: ${CUSTOMER_SESSION_SECRET:-change-me-in-production-min-32-chars!!}
    ports:
      - "3001:3000"     # note: engine listens on 3000 internally, exposed as 3001
    depends_on:
      postgres:
        condition: service_healthy
      btc-node-1:
        condition: service_healthy
      engine-1:
        condition: service_healthy   # engine-2 starts after engine-1 to let migrations run first
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  # ── btc-indexer — watches Node 1 ───────────────────────────────────────────
  btc-indexer-1:
    <<: *indexer-common
    container_name: chainapi-btc-indexer-1
    environment:
      <<: *indexer-env-common
      INDEXER_NODE_ID: btc-node-1
      INDEXER_BTC_NODE_URL: http://btc-node-1:18443
    depends_on:
      engine-1:
        condition: service_healthy   # wait for migrations to complete
      btc-node-1:
        condition: service_healthy

  # ── btc-indexer — watches Node 2 ───────────────────────────────────────────
  btc-indexer-2:
    <<: *indexer-common
    container_name: chainapi-btc-indexer-2
    environment:
      <<: *indexer-env-common
      INDEXER_NODE_ID: btc-node-2
      INDEXER_BTC_NODE_URL: http://btc-node-2:18443
    depends_on:
      engine-1:
        condition: service_healthy
      btc-node-2:
        condition: service_healthy

  # ── tron-indexer — watches tron-node-1 ────────────────────────────────────
  tron-indexer-1:
    <<: *tron-indexer-common
    container_name: chainapi-tron-indexer-1
    environment:
      <<: *tron-indexer-env-common
      INDEXER_NODE_ID: tron-node-1
      INDEXER_TRON_NODE_URL: http://tron-node-1:8090
    depends_on:
      engine-1:
        condition: service_healthy   # wait for migrations to complete
      tron-node-1:
        condition: service_healthy

  # ── tron-indexer — watches tron-node-2 ────────────────────────────────────
  tron-indexer-2:
    <<: *tron-indexer-common
    container_name: chainapi-tron-indexer-2
    environment:
      <<: *tron-indexer-env-common
      INDEXER_NODE_ID: tron-node-2
      INDEXER_TRON_NODE_URL: http://tron-node-2:8090
    depends_on:
      engine-1:
        condition: service_healthy
      tron-node-2:
        condition: service_healthy

  # ── nginx load balancer (engine-1 + engine-2 upstream) ─────────────────────
  # Exposes a single stable endpoint for signers, test clients, etc.
  # Uses passive health checks: max_fails=3 fail_timeout=15s
  # Signer CHAIN_API_BASE_URL should point here: http://localhost:3009
  nginx:
    image: nginx:alpine
    container_name: chainapi-nginx
    restart: unless-stopped
    ports:
      - "3009:3009"     # single stable engine endpoint
    volumes:
      - ./nginx/engine.conf:/etc/nginx/conf.d/engine.conf:ro
    depends_on:
      engine-1:
        condition: service_healthy
      engine-2:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 (explicit IPv4) — 'localhost' resolves to [::1] in Alpine
      # but nginx only listens on IPv4 unless explicitly configured with [::]:port.
      # Both nginx.conf and this healthcheck use explicit IPv4/IPv6 to be safe.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3009/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Test UI proxy ─────────────────────────────────────────────────────────
  ui:
    build: ./proxy
    container_name: chainapi-ui
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      # Node 1 — miner in regtest
      BITCOIN_RPC_URL: http://btc-node-1:18443
      BITCOIN_RPC_USER: bitcoin
      BITCOIN_RPC_PASSWORD: bitcoin
      BITCOIN_WALLET: btcminer
      # Node 2 — v3: proxy exposes both nodes, UI can choose which to query
      BITCOIN_RPC_URL_2: http://btc-node-2:18443
      BITCOIN_RPC_USER_2: bitcoin
      BITCOIN_RPC_PASSWORD_2: bitcoin
      # Engine: via nginx LB (routes to engine-1 or engine-2 round-robin)
      CHAIN_API_URL: http://nginx:3009
      # v3: show both engine URLs in health panel
      ENGINE_URL_2: http://engine-2:3000
      CHAIN_API_KEY: ${API_KEY:-}
      CHAIN_API_ADMIN_KEY: ${ADMIN_KEY:-}
      # TRON dev funding — genesis account (well-known devnet key, not a secret)
      TRON_NODE_URL: http://tron-node-1:8090
      TRON_DEV_PRIVATE_KEY: ${TRON_GENESIS_PRIVATE_KEY_HEX:-da146374a75310b9666e834ee4ad0866d6f4035967bfc76217c5a495fff9f0d0}
      TRON_DEV_ADDRESS: ${TRON_GENESIS_ADDRESS:-TPL66VK2gCXNCD7EJg9pgJRfqcRazjhUZY}
      TRON_USDT_CONTRACT: ${TRON_USDT_CONTRACT_ADDRESS:-}
    volumes:
      - ./ui:/app/ui:ro   # static frontend files (Rivets.js SPA)
    depends_on:
      nginx:
        condition: service_healthy

  # ── TRON sync watchdog — detects node-2 block-height stall, restarts node-2 ──
  # Stateless Docker healthchecks cannot detect "block not advancing" because
  # they have no memory of previous runs. This sidecar tracks height over time:
  # polls every 60 s, counts consecutive ticks where n2 is unchanged AND node-1
  # is >100 blocks ahead. At 10 consecutive stall ticks (10 min) it restarts
  # tron-node-2 via the Docker API. java-tron's ~30–60 s startup delay gives
  # node-1's TIME_BANNED (30 s) time to expire before the first reconnect,
  # breaking the ban-refresh feedback loop that causes the sync stall.
  tron-sync-watchdog:
    image: alpine/curl:latest
    container_name: chainapi-tron-sync-watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - sh
      - -c
      - |
        echo "tron-sync-watchdog: 300 s grace period for stack startup..."
        sleep 300
        prev=0; stall=0
        while true; do
          sleep 60
          n2=$$(curl -sf --max-time 5 http://tron-node-2:8090/wallet/getnowblock 2>/dev/null \
               | grep -oE '"number":[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          n1=$$(curl -sf --max-time 5 http://tron-node-1:8090/wallet/getnowblock 2>/dev/null \
               | grep -oE '"number":[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          n2=$${n2:-0}; n1=$${n1:-0}
          if [ "$$n2" -gt 0 ] && [ "$$n2" -eq "$$prev" ] && [ "$$n1" -gt 0 ] && [ "$$((n1-n2))" -gt 100 ]; then
            stall=$$((stall+1))
            echo "tron-sync-watchdog: stall $${stall}/10 — node-2 at $$n2, node-1 at $$n1 (lag $$((n1-n2)))"
            if [ "$$stall" -ge 10 ]; then
              echo "tron-sync-watchdog: 10-min stall — restarting chainapi-tron-node-2 to clear TIME_BANNED loop"
              curl -sf --max-time 10 --unix-socket /var/run/docker.sock \
                -X POST http://localhost/containers/chainapi-tron-node-2/restart \
                && echo "tron-sync-watchdog: restart issued" \
                || echo "tron-sync-watchdog: restart failed (check socket mount)"
              stall=0; sleep 90
            fi
          else
            [ "$$stall" -gt 0 ] && echo "tron-sync-watchdog: node-2 resumed at block $$n2"
            stall=0; prev=$$n2
          fi
        done
    depends_on:
      tron-node-2:
        condition: service_healthy

  # ── Vault dev server for Enterprise signer (profile: signer-enterprise) ───
  # Dev-only: root token is fixed and security is intentionally relaxed.
  vault:
    image: hashicorp/vault:1.16
    container_name: chainapi-vault
    profiles: [signer-enterprise, signer-all]
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=dev-root-token
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ── Elastic SIEM target for Enterprise signer audit events ────────────────
  # Dev-only: security disabled. Enterprise signer writes chain-api-signer-*.
  elasticsearch:
    image: elasticsearch:8.14.0
    container_name: chainapi-elasticsearch
    profiles: [signer-enterprise, signer-all]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kibana:
    image: kibana:8.14.0
    container_name: chainapi-kibana
    profiles: [signer-enterprise, signer-all]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Signer: OSS (profile: signer-oss) ────────────────────────────────────
  # Start with: docker compose -f docker-compose.v3.yml --profile signer-oss up -d
  # Or via start.sh: ./start.sh --v3 --signer oss
  signer-oss:
    build:
      context: ..                      # repo root — needed to access packages/
      dockerfile: signer-oss/Dockerfile
    container_name: chainapi-signer-oss
    profiles: [signer-oss, signer-all]
    restart: unless-stopped
    env_file: ../signer-oss/.env     # generated by start.sh --v3 --signer oss
    environment:
      # Override: point to nginx LB, not directly to engine-1
      CHAIN_API_BASE_URL: http://nginx:3009
      # No fallback needed — nginx handles engine failover internally
      CHAIN_API_FALLBACK_URLS: ""
      BTC_NETWORK: regtest
      SIGNER_BIND_HOST: "0.0.0.0"
    ports:
      - "${SIGNER_OSS_PORT:-3101}:${SIGNER_OSS_PORT:-3101}"
    volumes:
      - signer_oss_data:/app/data
    depends_on:
      nginx:
        condition: service_healthy

  # ── Signer: Enterprise (profile: signer-enterprise) ───────────────────────
  # Start with: docker compose -f docker-compose.v3.yml --profile signer-enterprise up -d
  # Or via start.sh: ./start.sh --v3 --signer enterprise
  signer-enterprise:
    build:
      context: ..                      # repo root — needed to access packages/
      dockerfile: signer/Dockerfile
    container_name: chainapi-signer-enterprise
    profiles: [signer-enterprise, signer-all]
    restart: unless-stopped
    env_file: ../signer/.env         # generated by start.sh --v3 --signer enterprise
    environment:
      CHAIN_API_BASE_URL: http://nginx:3009
      CHAIN_API_FALLBACK_URLS: ""
      BTC_NETWORK: regtest
      SIGNER_BIND_HOST: "0.0.0.0"
    ports:
      - "${SIGNER_ENT_PORT:-3102}:${SIGNER_ENT_PORT:-3102}"
    volumes:
      - signer_enterprise_data:/app/data
    depends_on:
      nginx:
        condition: service_healthy
      vault:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ── Signer: OSS TRON (profile: signer-oss) ───────────────────────────────
  # Separate TRON-only OSS signer daemon — handles tron_raw_tx tasks.
  # Started together with signer-oss when --signer oss|both is used.
  signer-oss-tron:
    build:
      context: ..                      # repo root — needed to access packages/
      dockerfile: signer-oss/Dockerfile
    container_name: chainapi-signer-oss-tron
    profiles: [signer-oss, signer-all]
    restart: unless-stopped
    env_file: ../signer-oss/.env.tron  # generated by start.sh --signer oss
    environment:
      # Override: point to nginx LB, not directly to engine-1
      CHAIN_API_BASE_URL: http://nginx:3009
      CHAIN_API_FALLBACK_URLS: ""
      TRON_NETWORK: private
      SIGNER_BIND_HOST: "0.0.0.0"
    ports:
      - "${SIGNER_OSS_TRON_PORT:-3103}:${SIGNER_OSS_TRON_PORT:-3103}"
    volumes:
      - signer_oss_tron_data:/app/data
    depends_on:
      nginx:
        condition: service_healthy

  # ── Signer: Enterprise TRON (profile: signer-enterprise) ─────────────────
  # Separate TRON-only Enterprise signer daemon — handles tron_raw_tx tasks.
  # Started together with signer-enterprise when --signer enterprise|both is used.
  signer-enterprise-tron:
    build:
      context: ..                      # repo root — needed to access packages/
      dockerfile: signer/Dockerfile
    container_name: chainapi-signer-enterprise-tron
    profiles: [signer-enterprise, signer-all]
    restart: unless-stopped
    env_file: ../signer/.env.tron      # generated by start.sh --signer enterprise
    environment:
      CHAIN_API_BASE_URL: http://nginx:3009
      CHAIN_API_FALLBACK_URLS: ""
      TRON_NETWORK: private
      SIGNER_BIND_HOST: "0.0.0.0"
    ports:
      - "${SIGNER_ENT_TRON_PORT:-3104}:${SIGNER_ENT_TRON_PORT:-3104}"
    volumes:
      - signer_enterprise_tron_data:/app/data
    depends_on:
      nginx:
        condition: service_healthy
      vault:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  btc_node_1:
  btc_node_2:
  tron_node_1:
  tron_node_2:
  signer_oss_data:
  signer_enterprise_data:
  signer_oss_tron_data:
  signer_enterprise_tron_data:
