# nginx upstream for chain-api engine cluster (v3 active-active)
#
# Round-robin across engine-1 and engine-2.
# max_fails + fail_timeout provide passive health checks:
#   - if engine-X fails 3 requests in 15s → marked unavailable for 15s
#   - nginx automatically retries on the other engine
#
# Note: signing tasks are safe to retry across engines because:
#   - Both engines share the same PostgreSQL DB
#   - Task claims use UPDATE WHERE status='pending' (idempotent)

upstream chain_engines {
    server engine-1:3000 max_fails=3 fail_timeout=15s;
    server engine-2:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 3009;
    server_name _;

    # Health check endpoint — always returns 200 from nginx itself
    location = /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # All other requests proxied to engine cluster
    location / {
        proxy_pass         http://chain_engines;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        # Timeouts: signing tasks can take up to 30s (external signing flow)
        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Retry on upstream errors (safe: engine API is idempotent per Idempotency-Key)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
