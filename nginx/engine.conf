# Load balancing across engine-1 and engine-2.
#
# Why resolver + variables instead of upstream block:
#   nginx open-source resolves upstream hostnames ONCE at startup (caches IPs).
#   After `docker compose restart engine-1`, the container gets a new IP and
#   nginx gets "connection refused" until it's manually restarted.
#   Using a variable in proxy_pass forces nginx to re-resolve via the Docker
#   internal DNS resolver (127.0.0.11) at the interval specified by `valid=`.
#
# Trade-off: no keepalive connection pool (upstream block required for that).
# Acceptable for dev; in production use nginx Plus or a sidecar like Consul.

split_clients "$request_id" $engine_backend {
    50%   engine-1:3000;
    *     engine-2:3000;
}

map $engine_backend $engine_fallback {
    "engine-1:3000"  engine-2:3000;
    default          engine-1:3000;
}

server {
    listen 3009;
    server_name _;

    # 127.0.0.11 — Docker's internal DNS resolver (always present in containers).
    # valid=10s  — re-resolve after 10s; catches IP changes after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log off;

    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass         http://$engine_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # If primary engine is unreachable (502/503), try the other one.
        error_page 502 503 = @fallback;
    }

    location @fallback {
        proxy_pass         http://$engine_fallback;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        proxy_connect_timeout 3s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
