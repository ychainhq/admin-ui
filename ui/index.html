<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LedgerConsole</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="src/tailwind.config.js"></script>

  <style>
    body {
      background-color: #0c1324;
      color: #dce1fb;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    [rv-cloak] { display: none; }
  </style>

  <!-- Tailwind safelist — ensures all dynamically-set classes are generated -->
  <div class="hidden
    border-l-4 border-l-secondary
    bg-tertiary/10 bg-outline/10 bg-secondary/10 bg-secondary/20
    bg-tertiary bg-outline bg-secondary bg-error/10
    text-tertiary text-on-surface-variant text-secondary text-error
    animate-pulse opacity-80
    border-secondary border-error/30
    bg-white/5 bg-white/10
    text-[10px] text-[14px] text-[16px]
    hover:bg-white/5
  " aria-hidden="true"></div>
</head>
<body class="font-body-md text-body-md selection:bg-secondary/30">

  <div id="app"></div>

  <!-- Rivets.js must load before the ES module app -->
  <script src="https://cdn.jsdelivr.net/npm/rivets@0.9.6/dist/rivets.bundled.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
