vm {
  supportConstant = true
  maxEnergyLimitForConstant = 100000000
  minTimeRatio = 0.0
  maxTimeRatio = 5.0
  saveInternalTx = false
}

committee {
  allowCreationOfContracts = 1
  allowAdaptiveEnergy = 0

  # TVM upgrade proposals — must match config-node1.conf exactly.
  # See config-node1.conf for rationale.
  allowTvmTransferTrc10 = 1
  allowMultiSign = 1
  allowTvmConstantinople = 1
  allowTvmSolidity059 = 1
  allowTvmIstanbul = 1
  allowTvmLondon = 1
  allowHigherLimitForMaxCpuTimeOfOneTx = 1
}
