# TRON private network — Node 2 (observer / sync-only)
# java-tron GreatVoyage-v4.7.7 HOCON config
#
# No localwitness — this node does NOT produce blocks.
# It connects to tron-node-1:18888 via P2P and syncs the blockchain.
# tron-indexer-2 watches this node for indexer redundancy.

net {
  type = mainnet
}

storage {
  db.version = 2
  db.engine = "LEVELDB"
  db.directory = "database"
  index.directory = "index"
  transactionHistoreSwitch = on  
}

node.discovery {
  # Must be enabled — disabling it shuts down the entire P2P subsystem including TCP active peers.
  # Kademlia UDP discovery won't find external peers (no seeds configured), but the TCP
  # active peer connection to tron-node-1 requires this to be true.
  enable = true
  persist = true
}

node.backup {
  port = 10001
  priority = 8
  members = []
}

seed.node = {
  # Kademlia bootstrap: gives node-2 a UDP-level discovery path to node-1.
  # Without this, Kademlia has no seed to bootstrap from after a restart,
  # and the only reconnection path is the `active` TCP list below.
  # With seeds, NodeManager independently rediscovers node-1 via UDP ping-pong,
  # providing an additional reconnect path when the TCP active connection is banned.
  ip.list = ["tron-node-1:18888"]
}

node {
  listen.port = 18888

  # TCP connection timeout per attempt (seconds).
  # Increasing from 2 → 20 stretches each failed attempt's wall-clock duration.
  # Combined with java-tron's ~30–60 s startup time after a container restart,
  # this ensures the first reconnect attempt lands AFTER node-1's TIME_BANNED
  # (30 s) has expired, breaking the ban-refresh feedback loop.
  connection.timeout = 20

  p2p.version = 11111

  # Active TCP peer — java-tron v4.7.7 requires string format "host:port" (NOT object {ip,port}).
  # node-1 is already healthy when node-2 starts, so the first connection attempt succeeds.
  active = ["tron-node-1:18888"]

  http {
    fullNodeEnable = true
    fullNodePort = 8090
    solidityEnable = true
    solidityPort = 8091
  }

  rpc {
    port = 50051
    solidityPort = 50061
    # Dev private net: keep RPC behavior usable while the peer is still catching up.
    minEffectiveConnection = 0
  }

  maxTransactionPendingSize = 2000
}

# No localwitness — observer only
localwitness = []

block {
  # false — required for private network. With true, the node waits for peers to verify sync
  # status on startup; finding no peers within the timeout it calls System.exit(1).
  # node-1 (SR witness) also sets this to false.
  needSyncCheck = false
  maintenanceTimeInterval = 21600000
  proposalExpireTime = 259200000
}

