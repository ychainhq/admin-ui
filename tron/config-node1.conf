# TRON private network — Node 1 (SR witness / block producer)
# java-tron GreatVoyage-v4.7.7 HOCON config
#
# Genesis account: TPL66VK2gCXNCD7EJg9pgJRfqcRazjhUZY
# Private key:     da146374a75310b9666e834ee4ad0866d6f4035967bfc76217c5a495fff9f0d0
# This is a well-known dev key published in TRON documentation — NOT for production.
#
# Block interval: 3s (TRON mainnet default)
# This node signs blocks. tron-node-2 is a non-signing observer.

net {
  type = mainnet
}

storage {
  db.version = 2
  db.engine = "LEVELDB"
  db.directory = "database"
  index.directory = "index"
  transactionHistoreSwitch = on
  outputDirectPath = "/data/tron"
}

node.discovery {
  # Must be enabled — disabling it shuts down the entire P2P subsystem including TCP active peers.
  # Kademlia UDP discovery won't find external peers (no seeds configured), but the TCP
  # active peer connection to tron-node-2 requires this to be true.
  enable = true
  persist = true
}

node.backup {
  port = 10001
  priority = 8
  members = []
}

node {
  # P2P listen port
  listen.port = 18888

  connection.timeout = 2

  # Seed nodes for the private network — node-2 connects to node-1 via these
  p2p.version = 11111

  # node-1 does NOT actively connect to node-2. node-2 connects to node-1 via its own
  # active = ["tron-node-1:18888"]. Reason: java-tron v4.7.7 has a bug in
  # Args.getInetSocketAddress — it catches UnknownHostException but leaves address=null,
  # then InetSocketAddress(null, port) throws NPE. On a fresh reset, node-2 doesn't
  # exist in Docker DNS when node-1 starts (depends_on delays node-2 creation until
  # node-1 is healthy). P2P connectivity is fully established by node-2 dialling node-1.
  active = []
  passive = []
  fastForward = []

  http {
    fullNodeEnable = true
    fullNodePort = 8090
    solidityEnable = true
    solidityPort = 8091
  }

  rpc {
    port = 50051
    solidityPort = 50061
    # Dev private net: allow the witness to accept locally-generated transactions
    # even while the observer is still catching up after a reset/restart.
    minEffectiveConnection = 0
  }

  maxTransactionPendingSize = 2000
}

# Block production: this node acts as the sole Super Representative
localwitness = [
  da146374a75310b9666e834ee4ad0866d6f4035967bfc76217c5a495fff9f0d0
]

block {
  needSyncCheck = false
  maintenanceTimeInterval = 21600000   # 6 hours
  proposalExpireTime = 259200000       # 3 days
}

